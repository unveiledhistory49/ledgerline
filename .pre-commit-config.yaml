# pre-commit is optional (CI runs the same checks explicitly).
# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [src/ledgerline]
        additional_dependencies: [pydantic>=2.7, pydantic-settings>=2.0, sqlalchemy>=2.0, fastapi>=0.115]
