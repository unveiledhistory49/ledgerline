[project]
name = "ledgerline"
version = "1.0.0"
description = "Double-entry accounting ledger with idempotent API, multi-currency, and auditable reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "click>=8.1",
  "httpx>=0.27",
]
[project.optional-dependencies]
test = ["pytest>=9.1.1", "httpx>=0.27", "hypothesis>=6", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=9.1.1", "httpx>=0.27", "hypothesis>=6"]
[project.scripts]
ledgerline = "ledgerline.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90"]
ignore = ["S101", "B008"]
# B008: FastAPI's documented pattern is Query()/Header() as parameter defaults.
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
[tool.coverage.run]
source = ["src/ledgerline"]
